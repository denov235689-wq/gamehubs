<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shashka</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --moss:#1f3a26; --deep:#122318; --bark:#5a3a1c; --wood:#8a5a2e; --gold:#e8c46a; --cream:#f3e7c8; --leaf:#7fbf6a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--deep);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(120% 60% at 50% 0%,#3c6b43 0%,var(--moss) 45%,var(--deep) 100%) fixed;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif}
#app{max-width:520px;margin:0 auto;padding:14px 16px 28px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.who{display:flex;align-items:center;gap:10px}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(#8fd37d,#4d9a54);border:3px solid var(--gold);display:grid;place-items:center;font-weight:700;color:#fff}
.bal{font-family:Georgia,serif;font-size:30px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:6px}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#d9a021);border:2px solid #a8761a;display:inline-block;box-shadow:0 1px 3px #0006}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.tile{background:linear-gradient(#7a4f27,var(--bark));border:2px solid #b98a45;border-radius:14px;padding:16px 8px;text-align:center;color:var(--cream);font:600 15px Georgia,serif;cursor:pointer}
.tile span{display:block;font-size:30px;margin-bottom:4px}
.tile:active,.btn:active,.play:active{transform:translateY(1px)}
.play{width:100%;padding:20px;font:700 30px Georgia,serif;letter-spacing:3px;color:#4b2e12;background:linear-gradient(#c9985a,#a8742f);border:3px solid #6e4a1d;border-radius:16px;box-shadow:0 5px 0 #5a3a1c,0 10px 18px #0007;cursor:pointer}
.sub{font-size:13px;opacity:.75;text-align:center;margin-top:10px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.head h2{margin:0;font-size:24px;flex:1}
.back{background:var(--bark);border:2px solid #b98a45;color:var(--cream);border-radius:10px;width:42px;height:42px;font-size:20px;cursor:pointer}
.card{background:#00000040;border:1px solid #b98a4577;border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row b{display:block}
.muted{font-size:13px;opacity:.75}
.btn{background:linear-gradient(#f0d27a,#d0a23c);color:#3b2608;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
.btn[disabled]{opacity:.45}
input{width:100%;background:#0006;border:1.5px solid #b98a45;color:var(--cream);border-radius:10px;padding:12px;font-size:16px;margin:8px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chip{background:#0005;border:1.5px solid #b98a45;color:var(--cream);border-radius:20px;padding:8px 14px;cursor:pointer}
.gate{text-align:center;padding-top:30px}
.gate h2{font-size:26px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const root = document.getElementById('app');
let me = null;

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== false && c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
async function api(path, body, method) {
  const r = await fetch('/api' + path, {
    method: method || (body ? 'POST' : 'GET'),
    headers: { 'Content-Type': 'application/json', 'x-init': tg.initData },
    body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Xatolik');
  return j;
}
const fmt = n => String(Number(Number(n).toFixed(2)));
const coin = () => h('i', { class: 'coin' });
const alertMsg = m => tg.showAlert(m);
const show = (...n) => { root.replaceChildren(...n); window.scrollTo(0, 0); };
const header = (title) => h('div', { class: 'head' },
  h('button', { class: 'back', 'aria-label': 'Orqaga', onclick: home }, '←'),
  h('h2', {}, title),
  h('div', { class: 'bal', style: 'font-size:20px' }, fmt(me.balance), coin()));

async function load() {
  try { me = await api('/me'); }
  catch (e) { return show(h('div', { class: 'gate' }, h('h2', {}, 'Ilovani Telegram ichidan oching'), h('p', { class: 'muted' }, e.message))); }
  me.missing.length ? gate() : home();
}

/* Majburiy kanallar */
function gate() {
  show(h('div', { class: 'gate' },
    h('h2', {}, 'Davom etish uchun kanallarga obuna bo\'ling'),
    ...me.missing.map(c => h('div', { class: 'card row' }, h('b', {}, c.title),
      h('button', { class: 'btn', onclick: () => tg.openTelegramLink(c.link) }, 'Obuna bo\'lish'))),
    h('button', { class: 'btn', style: 'width:100%;padding:14px;margin-top:8px', onclick: load }, 'Tekshirish')));
}

/* Bosh sahifa */
function tile(icon, text, fn) { return h('div', { class: 'tile', role: 'button', tabindex: 0, onclick: fn }, h('span', {}, icon), text); }
function home() {
  show(
    h('div', { class: 'top' },
      h('div', { class: 'who' }, h('div', { class: 'ava' }, (me.name[0] || '?').toUpperCase()), h('b', { class: 'serif' }, me.name)),
      h('div', { class: 'bal' }, fmt(me.balance), coin())),
    h('div', { class: 'grid' },
      tile('📋', 'Vazifalar', tasks),
      tile('👥', 'Do\'st bilan', invite),
      tile('➕', 'Depozit', deposit),
      tile('💵', 'Pul yechish', withdraw),
      me.isAdmin && tile('⚙️', 'Admin', () => location.href = '/admin.html')),
    h('button', { class: 'play', onclick: () => alertMsg('Shashka o\'yini keyingi bosqichda qo\'shiladi.') }, 'PLAY'),
    h('p', { class: 'sub' }, 'Do\'st taklif qiling: +' + fmt(me.refBonus) + ' tanga, uning depozitidan ' + me.refPercent + '%'));
}

/* Vazifalar */
async function tasks() {
  show(header('Vazifalar'), h('p', { class: 'muted' }, 'Yuklanmoqda…'));
  const list = await api('/tasks');
  show(header('Vazifalar'),
    list.length ? list.map(t => h('div', { class: 'card row' },
      h('div', {}, h('b', {}, t.title), h('span', { class: 'muted' }, '+' + fmt(t.reward) + ' tanga' + (t.daily ? ' · har kuni' : ''))),
      t.done ? h('span', { class: 'muted' }, 'Bajarildi ✓') :
        h('div', { class: 'row' },
          h('button', { class: 'btn ghost', onclick: () => tg.openTelegramLink(t.link) }, 'Obuna'),
          h('button', { class: 'btn', onclick: async ev => {
            ev.target.disabled = true;
            try { const r = await api('/tasks/claim', { id: t.id }); me.balance += r.reward; tasks(); }
            catch (e) { alertMsg(e.message); ev.target.disabled = false; }
          } }, 'Olish')))) : h('p', { class: 'muted' }, 'Hozircha vazifa yo\'q'));
}

/* Do'st taklif */
function invite() {
  show(header('Do\'st bilan'),
    h('div', { class: 'card' },
      h('p', {}, 'Har bir do\'st uchun +' + fmt(me.refBonus) + ' tanga. Do\'stingiz hisob to\'ldirsa, ' + me.refPercent + '% sizga qaytadi.'),
      h('input', { readonly: '', value: me.refLink }),
      h('button', { class: 'btn', style: 'width:100%;padding:14px', onclick: () =>
        tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(me.refLink) + '&text=' + encodeURIComponent('Shashka o\'ynab tanga yig\'ing!')) }, 'Do\'stlarga yuborish')));
}

/* Depozit (Telegram Stars) */
function deposit() {
  const inp = h('input', { type: 'number', inputmode: 'numeric', min: me.minStars, value: Math.max(me.minStars, 50) });
  const info = h('p', { class: 'muted' });
  const upd = () => info.textContent = '≈ ' + fmt((Number(inp.value) || 0) * me.rate) + ' tanga (1 ⭐ = ' + fmt(me.rate) + ' tanga)';
  inp.addEventListener('input', upd); upd();
  const btn = h('button', { class: 'btn', style: 'width:100%;padding:14px', onclick: async () => {
    btn.disabled = true;
    try {
      const { link } = await api('/deposit', { stars: Number(inp.value) });
      tg.openInvoice(link, async status => {
        if (status === 'paid') {
          alertMsg('To\'lov qabul qilindi!');
          setTimeout(async () => { me = await api('/me'); home(); }, 2000);
        }
        btn.disabled = false;
      });
    } catch (e) { alertMsg(e.message); btn.disabled = false; }
  } }, 'Stars bilan to\'lash');
  show(header('Depozit'), h('div', { class: 'card' },
    h('p', {}, 'Telegram Stars miqdorini kiriting:'),
    h('div', { class: 'chips' }, [10, 50, 100, 500].map(n => h('button', { class: 'chip', onclick: () => { inp.value = n; upd(); } }, n + ' ⭐'))),
    inp, info, btn));
}

/* Pul yechish */
function withdraw() {
  const who = h('input', { placeholder: 'PUBG ID yoki @username', maxlength: 100 });
  show(header('Pul yechish'),
    h('div', { class: 'card' }, h('p', { class: 'muted' }, 'Sovg\'a qayerga yuborilishini yozing:'), who),
    me.prizes.map(p => h('div', { class: 'card row' },
      h('div', {}, h('b', {}, p.title), h('span', { class: 'muted' }, fmt(p.coins) + ' tanga')),
      h('button', { class: 'btn', disabled: me.balance < p.coins ? '' : null, onclick: async ev => {
        if (!who.value.trim()) return alertMsg('PUBG ID yoki @username yozing');
        ev.target.disabled = true;
        try {
          await api('/withdraw', { prize: p.id, info: who.value });
          me.balance -= p.coins; alertMsg('So\'rov yuborildi. Admin tez orada bajaradi.'); home();
        } catch (e) { alertMsg(e.message); ev.target.disabled = false; }
      } }, 'Yechish'))));
}

load();
</script>
</body>
</html>
